# ------------------------------------------------------------
# Compresion de las respuestas.
#
# El backend corre en el equipo de desarrollo y se publica por un tunel, asi
# que lo que de verdad tarda no es generar la respuesta (20 a 45 ms medidos)
# sino mandarla por la red. Un listado de veinte pacientes son unos 3 KB de
# JSON que comprimidos bajan a menos de 1 KB.
#
# min-response-size evita comprimir lo pequeno: por debajo de 1 KB el tiempo
# de comprimir y descomprimir cuesta mas que los bytes que ahorra.
#
# No afecta a la robustez: si el cliente no manda Accept-Encoding, la
# respuesta sale en claro. Es el cliente quien decide.
# ------------------------------------------------------------
server:
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types:
      - application/json
      - application/xml
      - text/plain
      - text/html
      - text/css
      - application/javascript
  # Cierra las conexiones ociosas antes que el tunel, que las corta a los 60
  # segundos. Una conexion que el cliente cree viva y el tunel ya cerro
  # produce un error que parece del servidor.
  tomcat:
    connection-timeout: 20s
    keep-alive-timeout: 30s
    threads:
      max: 50
      min-spare: 10

# ============================================================
# Configuracion COMUN a todos los microservicios de MedCore.
# La sirve el config-server; cada servicio la recibe antes que
# su propio {servicio}.yml, que puede sobrescribir lo que haga falta.
#
# Regla G4: aqui no se escriben credenciales. Solo ${VARIABLES}
# que se resuelven desde .env o desde el entorno del contenedor.
# ============================================================

spring:
  jackson:
    default-property-inclusion: non_null
    serialization:
      # No se declara write-dates-as-timestamps: en Jackson 3, que es el que
      # trae Spring Boot 4, esa opcion salio de SerializationFeature y paso a
      # DateTimeFeature, y ademas su valor por defecto ya es ISO-8601.
      # Dejarla aqui rompe el arranque con:
      #   No enum constant tools.jackson.databind.SerializationFeature.write-dates-as-timestamps
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: America/Lima

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # Evita que un reintento duplique el evento.
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Se deserializa a bytes y el JSON lo convierte ByteArrayJsonMessageConverter,
      # que deduce el tipo de la firma del @KafkaListener.
      #
      # No se usa JsonDeserializer porque exige la cabecera __TypeId__ que anade
      # JsonSerializer, y falla con "No type information in headers and no default
      # type provided" ante cualquier productor que no la ponga: un reenvio manual
      # con kafka-console-producer, una reinyeccion de un evento o un productor
      # escrito en otro lenguaje.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      # Confirma el offset solo cuando el listener termina sin excepcion.
      ack-mode: record

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # Con estos valores Eureka detecta una instancia caida en ~15s,
    # en lugar de los 90s por defecto.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    probes:
      enabled: true
  info:
    env:
      enabled: true

# Documentacion OpenAPI (regla G7). El gateway agrega la de todos
# los servicios en un unico Swagger UI.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

logging:
  pattern:
    # X-Request-Id en cada linea, para seguir una operacion a traves
    # de varios servicios (MC4).
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
  level:
    root: INFO
    com.medcore: DEBUG
