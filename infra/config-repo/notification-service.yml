# notification-service (:8088) — correo, push e in-app.
# Es el consumidor con mas topicos: patient.created, appointment.created,
# appointment.cancelled, lab-order.created, result.registered,
# result.critical, stock.low y stock.expired.

server:
  port: ${SERVER_PORT:8088}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/notification_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Mailpit en desarrollo no usa autenticacion ni TLS.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  kafka:
    consumer:
      group-id: notification-service

notification:
  remitente: "no-responder@medcore.local"
  remitente-nombre: "MedCore"
  # Reintentos de envio ante fallo del servidor de correo.
  max-reintentos: 3
  # Los resultados criticos se envian de inmediato, sin agrupar.
  criticos-inmediatos: true
