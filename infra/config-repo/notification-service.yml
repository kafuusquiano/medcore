# notification-service (:8088) — correo, push e in-app.
# Es el consumidor con mas topicos: patient.created, appointment.created,
# appointment.cancelled, lab-order.created, result.registered,
# result.critical, stock.low y stock.expired.

server:
  port: ${SERVER_PORT:8088}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/notification_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Mailpit en desarrollo no usa autenticacion ni TLS.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  kafka:
    consumer:
      group-id: notification-service

notification:
  remitente: "no-responder@medcore.local"
  remitente-nombre: "MedCore"
  # Buzon de la clinica para los avisos del personal: valor critico, muestra
  # rechazada, lote vencido. Hace falta porque ningun evento trae el correo
  # del medico ni del laboratorista, solo su identificador, y pedirselo a
  # auth-service en cada aviso acoplaria este servicio a otro para un dato que
  # no cambia. El aviso in-app si llega a la persona concreta, por su id.
  correo-interno: "laboratorio@medcore.local"
  # Reintentos de envio ante fallo del servidor de correo.
  max-reintentos: 3
  # Los resultados criticos se envian de inmediato, sin agrupar.
  criticos-inmediatos: true
  # Procesado de la cola de envio cada minuto: recoge lo que fallo y lo
  # programado cuya hora ya llego.
  cron-envio: "0 * * * * *"
  # Recordatorios de cita, una vez al dia a las 08:00.
  cron-recordatorios: "0 0 8 * * *"
