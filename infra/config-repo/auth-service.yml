# auth-service (:8081) — autenticacion, JWT y roles.
# Base propia auth_db mas Redis para sesiones y blacklist de tokens.

server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/auth_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 3s

auth:
  # Tras este numero de intentos fallidos la cuenta pasa a BLOCKED.
  max-intentos-fallidos: 5
  # Prefijo de las claves de tokens revocados en Redis.
  blacklist-prefix: "medcore:auth:blacklist:"
  bcrypt-strength: 10
