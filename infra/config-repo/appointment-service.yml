# appointment-service (:8083) — citas, horarios y slots.
# Consume patient.created. Publica appointment.created y appointment.cancelled.
# Usa Feign hacia patient-service y Redis para cachear la disponibilidad.

server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/appointment_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  kafka:
    consumer:
      group-id: appointment-service

appointment:
  # Duracion de cada slot, en minutos.
  slot-duracion-minutos: 30
  # Dias hacia adelante para los que se generan slots.
  horizonte-dias: 30
  # Antelacion minima para cancelar sin penalidad, en horas.
  cancelacion-antelacion-horas: 24
  cache-slots-ttl-segundos: 120

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

resilience4j:
  circuitbreaker:
    instances:
      patientClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      patientClient:
        timeout-duration: 10s
