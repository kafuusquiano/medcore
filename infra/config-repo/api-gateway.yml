# api-gateway (:8080) — unico puerto expuesto al exterior.
# Valida el JWT, propaga X-User-Id, X-User-Role y X-Request-Id (MC4),
# aplica CORS y limita la tasa de peticiones con Redis.

server:
  port: ${SERVER_PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 3s
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Las rutas se declaran de forma explicita en RouteConfig,
              # no se autogeneran desde Eureka.
              enabled: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                # ngrok-skip-browser-warning debe poder pasar, o el frontend
                # recibe la pagina intersticial de ngrok en vez de JSON.
                allowed-headers: "*"
                exposed-headers: [X-Request-Id]
                allow-credentials: true
                max-age: 3600
          httpclient:
            connect-timeout: 10000
            # Holgado a proposito: el primer acceso del dia puede encontrar
            # un servicio recien arrancado y la JVM tarda en responder.
            response-timeout: 60s

gateway:
  rate-limit:
    # Peticiones por segundo por usuario, y pico admitido.
    replenish-rate: 20
    burst-capacity: 40
    requested-tokens: 1
  # Rutas que no exigen JWT (RouteValidator).
  rutas-publicas:
    - /api/auth/login
    - /api/auth/refresh
    - /actuator/health
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html

# ------------------------------------------------------------
# Documentacion agregada de los ocho servicios.
#
# Un solo Swagger UI en /swagger-ui.html con un desplegable por servicio, en
# lugar de ocho direcciones distintas que hay que recordar.
#
# Y es la base para generar el cliente del frontend: cada grupo expone su
# OpenAPI en /v3/api-docs/<nombre>, y de ahi sale el codigo de las llamadas
# sin escribirlas a mano. Escribir a mano cien endpoints es como se cuelan los
# errores de ruta y de DTO, que no se ven hasta que la pantalla no carga.
#
# Las URL son internas de la red de Compose (nombre:puerto). El gateway las
# consulta por su cuenta, asi que el navegador nunca habla con un servicio
# directamente.
# ------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Sin esto el desplegable sale con los grupos en el orden de descubrimiento
    # de Eureka, que cambia en cada arranque.
    disable-swagger-default-url: true
    urls-primary-name: auth-service
    urls:
      - name: auth-service
        url: /v3/api-docs/auth
      - name: patient-service
        url: /v3/api-docs/patient
      - name: appointment-service
        url: /v3/api-docs/appointment
      - name: medical-service
        url: /v3/api-docs/medical
      - name: laboratory-service
        url: /v3/api-docs/laboratory
      - name: inventory-service
        url: /v3/api-docs/inventory
      - name: analytics-service
        url: /v3/api-docs/analytics
      - name: notification-service
        url: /v3/api-docs/notification
