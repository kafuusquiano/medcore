# inventory-service (:8086) — reactivos, stock y alertas.
# Publica stock.low y stock.expired, y consume result.registered para
# descontar solo los reactivos que gasta cada prueba realizada.

server:
  port: ${SERVER_PORT:8086}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/inventory_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  kafka:
    consumer:
      # Grupo propio: analytics y notification consumen el mismo topico y
      # cada uno tiene que recibir todos los mensajes.
      group-id: inventory-service

inventory:
  # Dias de antelacion con que se avisa de un reactivo por vencer.
  alerta-vencimiento-dias: 30
  # Revision diaria de stock y vencimientos, a las 06:00.
  cron-revision: "0 0 6 * * *"
