# analytics-service (:8087) — epidemiologia y deteccion de brotes.
# Solo MongoDB: los datos son series y agregados, no relacionales.
# Consume result.registered y result.critical.

server:
  port: ${SERVER_PORT:8087}

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/analytics_db?authSource=admin
      auto-index-creation: false
  kafka:
    consumer:
      group-id: analytics-service

analytics:
  brote:
    # Casos del mismo CIE-10 en una zona dentro de la ventana para
    # considerar que hay un brote.
    umbral-casos: 5
    ventana-dias: 7
  # Recalculo de indicadores cada hora.
  cron-indicadores: "0 0 * * * *"
