# ============================================================
# MedCore — stack completo.
#
#   docker compose up -d --build
#   bash infra/kafka/create-topics.sh
#
# Orden de arranque (MC2), garantizado con depends_on + service_healthy:
#   1. postgres, mongodb, redis, kafka
#   2. eureka-server
#   3. config-server      (depende de eureka sano)
#   4. api-gateway        (depende de config sano)
#   5. los 8 microservicios, en paralelo
#
# Al host SOLO se publica el 8080 del gateway (MC4). Las bases de datos
# y los microservicios viven en la red interna y no son alcanzables desde
# fuera; eso es lo que hace segura la confianza en X-User-Role.
#
# Para desarrollar los servicios desde el IDE usa docker-compose.infra.yml,
# que si publica los puertos de las bases.
# ============================================================

name: medcore

x-jvm-env: &jvm-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  SPRING_PROFILES_ACTIVE: prod

x-service-healthcheck: &service-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  # La JVM tarda en arrancar; sin este margen Compose marca el
  # contenedor como unhealthy antes de que llegue a escuchar.
  start_period: 90s

services:

  # ---------- Nivel 1: datos ----------

  postgres:
    image: postgres:16.6-alpine
    container_name: medcore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcore}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcore} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [medcore-net]

  mongodb:
    image: mongo:7.0.16
    container_name: medcore-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-medcore}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-medcore}
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [medcore-net]

  redis:
    image: redis:7.4.1-alpine
    container_name: medcore-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [medcore-net]

  kafka:
    image: apache/kafka:3.7.1
    container_name: medcore-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Sin volumen: el contenedor corre como uid 1000 y un volumen nombrado
    # se crea como root, lo que impide formatear el directorio KRaft.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [medcore-net]

  # ---------- Nivel 2: service discovery ----------

  eureka-server:
    build:
      context: ./medcore-backend
      dockerfile: infrastructure/eureka-server/Dockerfile
    image: medcore/eureka-server:1.0.0
    container_name: medcore-eureka
    environment:
      <<: *jvm-env
      EUREKA_HOSTNAME: eureka-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      <<: *service-healthcheck
    networks: [medcore-net]

  # ---------- Nivel 3: configuracion ----------

  config-server:
    build:
      context: ./medcore-backend
      dockerfile: infrastructure/config-server/Dockerfile
    image: medcore/config-server:1.0.0
    container_name: medcore-config
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      <<: *jvm-env
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      # La configuracion se monta, no se copia a la imagen: cambiar un .yml
      # no obliga a reconstruir.
      - ./infra/config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      <<: *service-healthcheck
    networks: [medcore-net]

  # ---------- Nivel 4: puerta de entrada ----------

  api-gateway:
    build:
      context: ./medcore-backend
      dockerfile: infrastructure/api-gateway/Dockerfile
    image: medcore/api-gateway:1.0.0
    container_name: medcore-gateway
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *jvm-env
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      # El unico puerto publicado al host, y el unico que cruza el tunel.
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      <<: *service-healthcheck
    networks: [medcore-net]

  # ---------- Nivel 5: microservicios ----------
  # Se activan conforme se implementan (Fases 2 a 4). Cada uno repite
  # este patron, cambiando nombre, Dockerfile y variables de su base:
  #
  #   auth-service:
  #     build:
  #       context: ./medcore-backend
  #       dockerfile: services/auth-service/Dockerfile
  #     image: medcore/auth-service:1.0.0
  #     container_name: medcore-auth
  #     depends_on:
  #       config-server: { condition: service_healthy }
  #       postgres:      { condition: service_healthy }
  #       kafka:         { condition: service_healthy }
  #     environment:
  #       <<: *jvm-env
  #       EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
  #       SPRING_CLOUD_CONFIG_URI: http://config-server:8888
  #       POSTGRES_HOST: postgres
  #       POSTGRES_USER: ${POSTGRES_USER:-medcore}
  #       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcore}
  #       KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #       JWT_SECRET: ${JWT_SECRET}
  #     # Sin ports: no se publica al host (MC4).
  #     healthcheck:
  #       test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
  #       <<: *service-healthcheck
  #     networks: [medcore-net]

  # ---------- Utilidades de desarrollo ----------

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: medcore-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: medcore
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    profiles: [dev]
    networks: [medcore-net]

  # No lleva perfil dev: notification-service envia correo a traves de
  # mailpit tambien en el despliegue, porque "produccion" es esta misma
  # maquina. El 1025 (SMTP) queda solo en la red interna; se publica
  # unicamente el 8025 para revisar los correos enviados.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: medcore-mailpit
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [medcore-net]

volumes:
  pgdata:
  mongodata:
  redisdata:

networks:
  medcore-net:
    name: medcore-net
    driver: bridge
