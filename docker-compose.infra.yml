# ============================================================
# MedCore — solo infraestructura: bases de datos, Kafka y utilidades.
# Para desarrollar los microservicios desde el IDE o con mvnw.
#
#   docker compose -f docker-compose.infra.yml up -d
#   bash infra/kafka/create-topics.sh
#
# Los puertos se publican en localhost porque los servicios corren
# fuera de Docker. En docker-compose.yml (stack completo) solo se
# expone el 8080 del gateway, segun la regla MC4.
# ============================================================

name: medcore-infra

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: medcore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcore}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcore} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [medcore-net]

  mongodb:
    image: mongo:7.0.16
    container_name: medcore-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-medcore}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-medcore}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [medcore-net]

  redis:
    image: redis:7.4.1-alpine
    container_name: medcore-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [medcore-net]

  # Kafka en modo KRaft, sin Zookeeper (regla MC5).
  kafka:
    image: apache/kafka:3.7.1
    container_name: medcore-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      # 29092 para los servicios que corren fuera de Docker.
      - "29092:29092"
    # Sin volumen: el contenedor corre como uid 1000 y un volumen nombrado
    # se crea como root, lo que impide formatear el directorio KRaft.
    # Los topicos se recrean con infra/kafka/create-topics.sh, que es idempotente.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [medcore-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: medcore-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: medcore
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    networks: [medcore-net]

  # Servidor SMTP de pruebas para notification-service.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: medcore-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interfaz web
    networks: [medcore-net]

volumes:
  pgdata:
  mongodata:
  redisdata:

networks:
  medcore-net:
    name: medcore-net
    driver: bridge
