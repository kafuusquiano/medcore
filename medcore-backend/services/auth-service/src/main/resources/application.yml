# ============================================================
# auth-service — configuracion minima dentro del JAR (regla MC3).
# Solo nombre, puerto e importacion del config-server. El resto
# (base de datos, Redis, parametros) vive en
# infra/config-repo/auth-service.yml
# ============================================================

spring:
  application:
    name: auth-service
  profiles:
    default: local
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000
        max-interval: 10000

server:
  port: ${SERVER_PORT:8081}
