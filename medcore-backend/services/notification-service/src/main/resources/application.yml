# ============================================================
# notification-service - configuracion minima dentro del JAR (regla MC3).
# Solo nombre, puerto e importacion del config-server. La base de datos, el
# correo y los parametros viven en infra/config-repo/notification-service.yml
# ============================================================

spring:
  application:
    name: notification-service
  profiles:
    default: local
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000
        max-interval: 10000

server:
  port: ${SERVER_PORT:8088}
