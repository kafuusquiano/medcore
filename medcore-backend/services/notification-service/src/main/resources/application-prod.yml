# ============================================================
# notification-service - perfil prod (dentro de docker-compose).
# No publica puerto al host: solo el gateway lo alcanza (MC4).
# ============================================================

spring:
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}

logging:
  level:
    root: INFO
    com.medcore.notification: INFO
    org.hibernate.SQL: WARN
    # El log de correo lleva direcciones y cuerpos con datos del paciente.
    org.springframework.mail: WARN
