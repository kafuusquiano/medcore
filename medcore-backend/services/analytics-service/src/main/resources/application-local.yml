# ============================================================
# analytics-service - perfil local (ejecucion fuera de Docker).
# ============================================================

spring:
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}

logging:
  level:
    com.medcore.analytics: DEBUG
    org.springframework.security: INFO
    # Las agregaciones se registran al depurar una consulta lenta, pero
    # llevan zonas y documentos de pacientes: en prod sube a WARN.
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
